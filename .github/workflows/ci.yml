name: CI

on:
  push:
  pull_request:

# Third-party actions are pinned to full commit SHAs, not tags. A tag is a
# mutable pointer: whoever controls the action's repo can retarget `v4` at new
# code, and that code runs here with this workflow's token. A SHA cannot be
# retargeted. Update these deliberately, with the version comment kept in sync.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-windows-x64
          path: |
            dist/cadence.exe
            dist/cadence-win-x64.zip
