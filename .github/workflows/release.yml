name: Release executable

on:
  push:
    tags: ['v*']

# This job holds `contents: write`, so a compromised action here could publish
# releases as us. Pin every action to an immutable commit SHA — see ci.yml.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build:exe passes --publish never so electron-builder does not try to
      # create the GitHub release itself when a tag is present (that path needs
      # GH_TOKEN and aborted v0.5.0 after the setup exe was already built).
      # softprops/action-gh-release below owns publishing the artifacts.
      - run: npm run build:exe
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Cadence-Installer.exe upgrades an existing install in place.
          # The zip is the same app as a plain folder for CLI use.
          files: |
            dist/Cadence-Installer.exe
            dist/cadence-win-x64.zip
          generate_release_notes: true
